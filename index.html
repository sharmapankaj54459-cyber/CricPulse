<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FitBharat Arena | 2K Live Multi-Sport Scorer</title>
  <meta name="theme-color" content="#070b14" />
  <link rel="preconnect" href="https://googleapis.com">
  <link href="https://googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg-dark: #060913;
      --card-bg: rgba(16, 24, 43, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --neon-green: #00f59b;
      --neon-blue: #00d2ff;
      --neon-gold: #ffb703;
      --neon-red: #ff2a5f;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at top, #111c38 0%, var(--bg-dark) 65%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 85px;
    }

    .broadcast-header {
      background: linear-gradient(90deg, rgba(6,9,19,0.95), rgba(17,28,56,0.95));
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
      display: grid; place-items: center; font-weight: 900; color: #000;
      font-family: 'Chakra Petch', sans-serif; font-size: 18px;
      box-shadow: 0 0 15px rgba(0, 245, 155, 0.4);
    }
    .brand h1 { font-family: 'Chakra Petch', sans-serif; font-size: 19px; letter-spacing: 0.5px; text-transform: uppercase; }
    .live-badge {
      background: rgba(255, 42, 95, 0.15); border: 1px solid var(--neon-red);
      color: var(--neon-red); padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 6px;
    }
    .live-dot { width: 8px; height: 8px; background: var(--neon-red); border-radius: 50%; animation: pulse 1.2s infinite; }

    @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.4; } 100% { transform: scale(0.9); opacity: 1; } }

    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    .section { display: none; animation: fadeIn 0.3s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .sport-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }
    .sport-tile {
      background: linear-gradient(145deg, rgba(24,36,64,0.9), rgba(12,18,34,0.95));
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .sport-tile:hover, .sport-tile:active {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--neon-green);
      box-shadow: 0 10px 25px rgba(0, 245, 155, 0.2);
    }
    .sport-icon { font-size: 36px; margin-bottom: 8px; display: block; }
    .sport-name { font-family: 'Chakra Petch', sans-serif; font-size: 16px; font-weight: 700; }
    .sport-tag { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    input, select {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      background: rgba(6, 10, 20, 0.8); border: 1px solid var(--glass-border);
      color: #fff; font-size: 14px; outline: none;
    }
    input:focus, select:focus { border-color: var(--neon-blue); }

    .btn {
      padding: 12px 18px; border-radius: 12px; border: none; font-weight: 700;
      font-size: 14px; cursor: pointer; transition: 0.2s; display: inline-flex;
      align-items: center; justify-content: center; gap: 8px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: linear-gradient(135deg, var(--neon-green), #00c47a); color: #000; width: 100%; }
    .btn-blue { background: linear-gradient(135deg, var(--neon-blue), #0088cc); color: #000; }
    .btn-danger { background: rgba(255, 42, 95, 0.2); border: 1px solid var(--neon-red); color: var(--neon-red); }
    .btn-ghost { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--glass-border); }

    .tv-banner {
      background: linear-gradient(135deg, #0b192c 0%, #162b4d 50%, #091322 100%);
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 20px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .tv-banner::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue), var(--neon-gold));
    }
    .score-big {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 20px rgba(0, 245, 155, 0.3);
    }
    .teams-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .team-box { flex: 1; }
    .team-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--neon-blue); font-weight: 800; }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .key-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 16px 8px;
      border-radius: 14px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .key-btn:active { transform: scale(0.92); background: var(--neon-blue); color: #000; }
    .key-4 { border-color: var(--neon-blue); color: var(--neon-blue); }
    .key-6 { border-color: var(--neon-gold); color: var(--neon-gold); background: rgba(255,183,3,0.1); }
    .key-w { border-color: var(--neon-red); color: var(--neon-red); background: rgba(255,42,95,0.12); }

    #celebration-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 999;
      display: grid; place-items: center; opacity: 0; transition: opacity 0.25s;
    }
    #celebration-overlay.show { opacity: 1; }
    .cele-text {
      font-family: 'Chakra Petch', sans-serif; font-size: 56px; font-weight: 900;
      text-transform: uppercase; letter-spacing: 2px; text-align: center;
      background: linear-gradient(to right, #fff, var(--neon-gold), var(--neon-green));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.9));
      animation: popScale 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49);
    }
    @keyframes popScale { 0% { transform: scale(0.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .over-balls { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .ball-dot {
      width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      font-size: 12px; font-weight: 800; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
    }
    .ball-4 { background: var(--neon-blue); color: #000; }
    .ball-6 { background: var(--neon-gold); color: #000; }
    .ball-w { background: var(--neon-red); color: #fff; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(6, 9, 19, 0.96); backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
    }
    .nav-item {
      background: none; border: none; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .nav-item.active { color: var(--neon-green); }
    .nav-item span { font-size: 20px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--glass-border); }
    th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
    canvas { width: 100%; height: 180px; background: rgba(0,0,0,0.25); border-radius: 12px; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="celebration-overlay"><div class="cele-text" id="cele-label">SIX! 6</div></div>

  <header class="broadcast-header">
    <div class="brand">
      <div class="brand-logo">2K</div>
      <div>
        <h1>FitBharat Arena</h1>
        <div style="font-size: 10px; color: var(--neon-green);">MULTI-SPORT LIVE BROADCAST</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
